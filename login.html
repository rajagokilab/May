<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MK Sport Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body {
            background-image: url('./Sports%20Equipment/sports%20(5).png'); /* Replace with your actual image path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: rgb(12, 12, 12);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* To contain animations */
        }

        .overlay {
            background-color: rgba(0, 74, 130, 0.6); /* semi-transparent blue */
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            animation: fadeInScale 0.5s ease-out forwards 0.3s; /* Fade in and scale up */
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .form-control {
            border-radius: 10px;
            font-weight: bold;
            background-color: #e0f2f7; /* A lighter blue for input fields */
            border: 1px solid #b0bec5; /* Subtle border */
            color: #37474f; /* Darker text for better readability */
            opacity: 0;
            transform: translateY(-10px);
            animation: slideIn 0.3s ease-out forwards 0.6s; /* Slide in animation */
        }

        .form-control::placeholder {
            color: #78909c; /* Light grey for placeholder text */
            font-weight: normal;
        }

        .btn-custom {
            background-color: #263238; /* Dark grey/black for button */
            color: white;
            border-radius: 30px;
            padding: 10px 30px;
            font-weight: bold;
            border: none; /* Remove default button border */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease-in-out; /* Smooth hover effect */
            opacity: 0;
            transform: scale(0.8);
            animation: fadeInScaleButton 0.4s ease-out forwards 0.9s; /* Fade in and scale up */
        }

        .btn-custom:hover {
            background-color: #000a12; /* Darker shade on hover */
            transform: scale(1.05);
        }

        @keyframes fadeInScaleButton {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: rgb(7, 7, 7);
            text-align: center;
            margin-bottom: 20px;
            position: absolute;
            font-weight: bolder;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px); /* Initial position above */
            z-index: 10; /* Ensure it's above the overlay */
            animation: slideDown 0.5s ease-out forwards; /* Slide down animation */
        }

        @keyframes slideDown {
            to {
                transform: translateX(-50%) translateY(0);
            }
        }

        h1 span {
            color: #3498db; /* MK blue color */
        }

        .loginhead {
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-10px);
            animation: slideIn 0.3s ease-out forwards 0.4s; /* Slide in animation */
        }

        .mb-3 {
            margin-bottom: 25px !important; /* Increase spacing between form elements */
        }

        .form-box {
            /* Initially hidden and scaled down */
            opacity: 0;
            transform: scale(0.8);
            /* Apply a combined fade-in and scale-up animation */
            animation: fadeInScaleForm 0.5s ease-out forwards 0.6s;
        }

        @keyframes fadeInScaleForm {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .form-box p {
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpText 0.3s ease-out forwards 1.1s;
        }

        .form-box p a {
            color: #3498db;
        }

        @keyframes slideUpText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <h1>WELCOME TO <span>MK</span> SPORT</h1>
    <div class="login-container">
        <div class="overlay">
            <h4 class="loginhead">LOGIN TO ACCOUNT</h4>
            <form id="loginForm">
                <div class="mb-3">
                    <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-custom">LOG IN</button>
            </form>
            <p class="mt-3">Don't have an account? <a href="index.html">Register here</a></p>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            const regEmail = localStorage.getItem("registeredEmail");
            const regPassword = localStorage.getItem("registeredPassword");

            if (email === regEmail && password === regPassword) {
                alert("Login successful!");
                window.location.href = "home.html"; // redirect after login
            } else {
                alert("Invalid email or password. Try again or register first.");
            }
        });
    </script>
</body>
</html>
