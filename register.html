<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MKsport Register</title>
    <link rel="icon" type="image/png" href="sports equipments part 2\sports (56).png" style="border-radius: 50%;">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #e0f7fa url('Sports Equipment/sports (7).png') no-repeat center center;
            background-size: cover;
            overflow: hidden; /* To hide the moving background overflow */
            animation: moveBackground 10s linear infinite; /* Add background animation */
        }
        @keyframes moveBackground {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }
        .form-box {
            background-color: rgba(118, 139, 118, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            opacity: 0; /* Initially hidden */
            transform: translateY(20px); /* Initial vertical offset */
            animation: fadeIn 0.5s ease-out 0.5s forwards; /* Fade in animation */
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        header {
            position: absolute;
            top: 20px;
            left: 0; /* Reset left position */
            width: 100%; /* Make it span the entire width */
            text-align: center; /* Center the text */
            color: white;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <section>
    <Header>WELCOME TO MK SPORTS</Header>
    <div class="form-box">
        <h2 class="text-center mb-4">Register</h2>
        <form id="registerForm">
            <div class="mb-3">
                <input type="email" class="form-control" id="regEmail" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="regPassword" placeholder="Password (min 8 chars)" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 text-center text-white">Already registered? <a href="index.html" class="text-info">Login here</a></p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value.trim();

            if (password.length < 8) {
                alert("Password must be at least 8 characters.");
                return;
            }

            localStorage.setItem("registeredEmail", email);
            localStorage.setItem("registeredPassword", password);

            alert("Registration successful! Please login.");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
